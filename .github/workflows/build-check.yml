name: Build check

# Compiles the phone and watch apps on pull requests so a broken build is caught before it
# reaches main (where every push ships a release). Builds only; nothing is signed or published.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build release APKs (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
